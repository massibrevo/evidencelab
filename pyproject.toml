[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "evidencelab"
version = "0.2.0"
description = "An inspectable, local-first laboratory for evidence-grounded LLM systems"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2.1,<3", "httpx>=0.28,<1", "pydantic>=2.10,<3", "pypdf>=5.3,<7", "python-multipart>=0.0.20,<1", "langgraph>=1.0,<2", "psutil>=6,<8", "matplotlib>=3.9,<4", "nbformat>=5.10,<6"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "nbclient>=0.10,<1", "ipykernel>=6,<8", "qdrant-client>=1.14,<2"]
rag = ["sentence-transformers>=5,<6", "qdrant-client>=1.14,<2", "umap-learn>=0.5.7,<1"]
models = ["torch>=2.6,<3", "transformers>=5.2,<6", "accelerate>=1.4,<2", "peft>=0.18,<1"]
train = ["evidencelab[models]", "trl>=0.29,<1", "datasets>=5.0.1,<6", "fsspec>=2026.6.0", "mlflow>=3,<4"]
qlora = ["evidencelab[train]", "bitsandbytes>=0.45,<1; sys_platform == 'linux'"]
benchmark = ["evidencelab[models]", "lm-eval[hf]==0.4.13", "datasets>=5.0.1,<6", "fsspec>=2026.6.0"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[project.scripts]
evidencelab = "evidencelab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evidencelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel.force-include]
"data/demo" = "evidencelab/resources/demo"

"notebooks" = "evidencelab/resources/notebooks"
"docs/experiments/scifact-cpu.json" = "evidencelab/resources/reference.json"
