name: Verify EvidenceLab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check src tests scripts
      - run: uv run python scripts/benchmark_models.py --suite smoke
      - run: uv run python scripts/execute_notebooks.py
      - run: EVIDENCELAB_TEST_NOTEBOOKS=1 uv run pytest tests/optional/test_notebook_kernel.py -q
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
